[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lynx"
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lynx = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]