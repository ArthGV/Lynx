[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lynx"
dynamic = ["version"]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[project.scripts]
lynx = "lynx.main:main"

[tool.setuptools.packages.find]
include = ["lynx*"]

[tool.setuptools.dynamic]
version = { attr = "lynx.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "PIE", "PYI", "RUF"]
ignore = [
    "F821",   # false positives from lazy imports in types/base_type.py
    "RUF012", # mutable class vars are intentional (default_value)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "lynx.core.nodes",
    "lynx.core.lexer",
    "lynx.core.interpreter._base",
    "lynx.runtime.environment",
    "lynx.errors.errors",
    "editors.vscode.generate",
    "tests.*",
]
disallow_any_explicit = false

# The two parser mixins compose into one class at runtime, so mypy can't see a
# statement rule calling an expression rule. `peek()` is also nullable, so
# `.peek().line` after a successful `match()`/`type()` check can't be narrowed.
[[tool.mypy.overrides]]
module = ["lynx.core.parser.*"]
disallow_any_explicit = false
disable_error_code = ["attr-defined", "union-attr"]